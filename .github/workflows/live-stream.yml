name: Live Stream

# हर चैनल अपना अलग job है और ~5.5 घंटे stream करता है.
# खत्म होने से 25 मिनट पहले वह अपना अगला session खुद शुरू करवा देता है (handoff),
# इसलिए चैनल लगातार चलता रहता है.
# शुरू करने के लिए: Actions -> Live Stream -> Run workflow (channel = all)

run-name: "Live: ${{ inputs.channel || 'all' }}"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "'all' या चैनल नंबर, जैसे 1 या 1,3,5"
        default: "all"
        required: false
      prev_run_id:
        description: "(handoff के लिए, हाथ से न भरें)"
        required: false

permissions:
  contents: read
  actions: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          STREAMING_ENABLED: ${{ vars.STREAMING_ENABLED }}
        run: python3 live/live.py plan --channel "${{ inputs.channel || 'all' }}"

  stream:
    name: Channel ${{ matrix.channel }}
    needs: plan
    if: needs.plan.outputs.channels != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    env:
      PREV_RUN_ID: ${{ inputs.prev_run_id }}
      YT_STREAM_KEY: ${{ secrets[format('YT_STREAM_KEY_{0}', matrix.channel)] }}
      FB_STREAM_KEY: ${{ secrets[format('FB_STREAM_KEY_{0}', matrix.channel)] }}
      YT_COOKIES: ${{ secrets.YT_COOKIES }}
    steps:
      - name: Job start time
        run: echo "LIVE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Duplicate check
        run: python3 live/live.py guard --channel ${{ matrix.channel }}

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install -q -U "yt-dlp[default]"

      - name: Cache key
        id: key
        run: python3 live/live.py key --channel ${{ matrix.channel }}

      - name: Restore prepared videos
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: media/ch${{ matrix.channel }}
          key: live-v2-ch${{ matrix.channel }}-${{ steps.key.outputs.key }}
          # लिस्ट बदली हो तो भी इस चैनल की पिछली तैयार वीडियो वापस मिलें (दोबारा डाउनलोड न हों)
          restore-keys: |
            live-v2-ch${{ matrix.channel }}-

      - name: Prepare videos
        if: steps.cache.outputs.cache-hit != 'true'
        run: python3 live/live.py prepare --channel ${{ matrix.channel }}

      - name: Save prepared videos
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: media/ch${{ matrix.channel }}
          key: live-v2-ch${{ matrix.channel }}-${{ steps.key.outputs.key }}

      - name: Wait for previous session
        run: python3 live/live.py wait-prev --channel ${{ matrix.channel }}

      - name: Go live
        run: python3 live/live.py stream --channel ${{ matrix.channel }}
